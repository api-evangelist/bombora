- aid: bombora:bombora-intent-api
  name: Bombora Intent API
  description: >-
    Streams Bombora's Company Surge intent signals — account-level scores against 18,000+ B2B intent topics
    — derived from the Bombora Data Cooperative. Subscribers pull weekly Surge scores for monitored topics
    and accounts and integrate them into CRM, marketing automation, and ABM platforms.
  humanURL: https://developer.bombora.com/docs/intent-api/1/overview
  tags:
