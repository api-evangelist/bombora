aid: bombora
name: Bombora
description: >-
  Bombora is a New York-based B2B data company that provides intent data and
  identity solutions used by marketing, sales, and ad-tech teams to identify
  in-market accounts and personalize outreach. Its flagship product, Company
  Surge, aggregates anonymous content-consumption signals from a cooperative
  of more than 5,000 B2B publishers and scores accounts against 18,000+
  B2B intent topics to surface organizations actively researching specific
  products, services, and categories. Beyond Company Surge, Bombora offers
  Identity and Enrichment for first-party visitor resolution, Digital
  Audiences for activation across DSPs and walled gardens, Campaign
  Measurement for B2B attribution, and an Insights Suite that combines
  intent, visitor, and engagement signals. Bombora exposes a developer
  portal at developer.bombora.com with OAuth 2.0 authentication and a
  catalog of REST APIs covering intent feeds, reference taxonomies, digital
  audience activation, webhooks, and Company Surge report orchestration
  (v4 via sentry.bombora.com). The portal's API reference is gated behind
  login and Bombora does not publish public OpenAPI specifications;
  commercial access is sold via annual contracts with no public pricing,
  typically starting around $30K/year and scaling with topic volume and
  integration scope. Bombora integrates broadly with the B2B revenue
  stack, including Salesforce, HubSpot, LinkedIn, 6sense, Demandbase,
  Apollo, ZoomInfo, Dun and Bradstreet, Snowflake, and Adobe Experience
  Platform, and is profiled here for its role as the dominant supplier of
  cooperative-sourced B2B intent data.
