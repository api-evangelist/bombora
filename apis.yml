- aid: bombora:bombora-company-surge-api
  name: Bombora Company Surge API (v4)
  description: Partner API for orchestrating Company Surge reports — create reports with topic, geography,
    blacklist, and AutoGen options (POST /v4/Surge/Create), list reports (GET /v4/Surge/GetList),
