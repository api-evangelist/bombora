    url: overlays/bombora-intent-api-overlay.yaml
  baseURL: https://api.bombora.com/intent/v1
- aid: bombora:bombora-company-surge-api
  name: Bombora Company Surge API (v4)
  description: >-
    Partner API for orchestrating Company Surge reports — create reports with topic, geography, blacklist,
    and AutoGen options (POST /v4/Surge/Create), list reports (GET /v4/Surge/GetList), and retrieve report
    results. Uses Basic auth with username:password base64 credentials and is rate limited to 60 calls
    per minute per endpoint. Hosted at sentry.bombora.com and documented on the Bombora Partners Confluence
    space.
  humanURL: https://bombora-partners.atlassian.net/wiki/spaces/DOC/pages/20381698/Surge+API
  baseURL: https://sentry.bombora.com/v4/Surge
