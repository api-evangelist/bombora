- aid: bombora:bombora-account-list-api
  name: Bombora Account List API
  description: Defines and maintains lists of B2B accounts, keyed on company domain. Lists can be
    manually curated, synchronized from external systems, derived by segmenting a parent list with
    a predicate filter, sourced from a Company Surge signal definition, or built from Visitor Insights.
    Provides account membership add/update/delete, domain listing, and account data search.
  humanURL: https://developer.bombora.com/docs/account-list-api/1/overview
