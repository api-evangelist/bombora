aid: bombora
name: Bombora
description: 'Bombora is a New York-based B2B data company that provides intent data and identity
  solutions used by marketing, sales, and ad-tech teams to identify in-market accounts and personalize
  outreach. Its flagship product, Company Surge, aggregates anonymous content-consumption signals
  from a cooperative of more than 5,000 B2B publishers and scores accounts against 18,000+ B2B intent
  topics to surface organizations actively researching specific products, services, and categories.
  Beyond Company Surge, Bombora offers Identity and Enrichment for first-party visitor resolution,
  Digital Audiences for activation across DSPs and walled gardens, Campaign Measurement for B2B attribution,
  and an Insights Suite that combines intent, visitor, and engagement signals. Bombora runs an Apigee
  Integrated Developer Portal at developer.bombora.com that publishes six OpenAPI 3.0 documents anonymously
  — Intent, Reference, Account List, Digital Audience Builder, Webhooks, and Authentication — covering
  54 operations on api.bombora.com, all secured with OAuth 2.0 client credentials exchanged for a
  bearer JWT at POST /oauth/token. A separate legacy partner Company Surge API (v4) runs on sentry.bombora.com
  with HTTP Basic auth and a documented 60 calls-per-minute-per-endpoint limit. Credentials are not
  self-service: the portal is SAML-only and restricted to existing Bombora customers, the Intent
  and Digital Audience products require manual per-application approval, and no pricing is published
  — commercial access is sold via annual contracts. Bombora integrates broadly with the B2B revenue
  stack, including Salesforce, HubSpot, LinkedIn, 6sense, Demandbase, Apollo, ZoomInfo, Dun and Bradstreet,
  Snowflake, and Adobe Experience Platform, and is profiled here for its role as the dominant supplier
  of cooperative-sourced B2B intent data.'
