entities:
- name: AccountList
  api: Account List API
  schemas: [AccountListDefinition, AccountListSummary, Metadata, AccountListType]
  key: id (uuid)
  description: >-
    A named set of accounts. Four subtypes, each with its own specification schema:
    Manual, Derived (from a parent list + predicate filter), Surge (from a signal definition +
    topics), and VisitorInsights.
  operations:
  - GET /account-list
  - POST /account-list
  - GET /account-list/{accountListId}
  - PUT /account-list/{accountListId}
  - DELETE /account-list/{accountListId}
- name: Account
  api: Account List API
  schemas: [Account]
  key: domain
  description: A company inside an account list, keyed on domain, carrying attributes and company firmographics.
  operations:
  - POST /account-list/{accountListId}/accounts
  - DELETE /account-list/{accountListId}/accounts
  - GET /account-list/{accountListId}/accounts/domains
  - GET /account-list/{accountListId}/accounts/search
  - POST /account-list/{accountListId}/accounts/search
  - POST /account-list/{accountListId}/delete-accounts
- name: SignalDefinition
  api: Intent API
  schemas: [SignalDefinition, Metadata, ProductDefinition]
  key: signalDefinitionId (uuid)
  description: >-
    A saved definition of what intent to measure — a topic set plus metadata. Carries two
    sub-resources, metadata and product-definition (keywords, urls, domain).
  operations:
  - GET /signal-definitions
  - POST /signal-definition
  - GET /signal-definition/{signalDefinitionId}
  - PUT /signal-definition/{signalDefinitionId}
  - DELETE /signal-definition/{signalDefinitionId}
  - GET /signal-definition/{signalDefinitionId}/metadata
  - PUT /signal-definition/{signalDefinitionId}/metadata
  - GET /signal-definition/{signalDefinitionId}/product-definition
  - PUT /signal-definition/{signalDefinitionId}/product-definition
- name: IntentData
  api: Intent API
  schemas: []
  key: none
  description: >-
    The intent readings themselves, retrieved against a signal definition. Returned by GET /data
    and POST /data (the POST form carries a larger request in the body).
  operations: [GET /data, POST /data]
- name: DigitalAudience
  api: Digital Audience Builder (DAB) API
  schemas: [name, status, externalId, partnerId, cpmPrice, endDate, topics, domains, filters, surgeId, granularInstallData, entityParty]
  key: '{dataexchange}/{externalId}/{partnerId}'
  description: >-
    A custom B2B audience composed from topics, domains and demographic/firmographic filters, then
    activated or suspended against a data exchange and partner. Has a status lifecycle and a
    cpmPrice.
  operations:
  - POST /{dataexchange}
  - GET /{dataexchange}/{externalId}/{partnerId}
  - PUT /{dataexchange}/{externalId}/{partnerId}
  - DELETE /{dataexchange}/{externalId}/{partnerId}
  - PUT /{dataexchange}/{externalId}/{partnerId}/activate
  - PUT /{dataexchange}/{externalId}/{partnerId}/suspend
  - POST /{dataexchange}/estimate
- name: Destination
  api: Webhooks API
  schemas: [Destination, DestinationSummary, auth]
  key: destinationId (uuid)
  description: >-
    A customer HTTPS endpoint Bombora posts events to, with optional static headers and a
    write-only auth.secret used to HMAC-sign deliveries.
  operations:
  - GET /destinations
  - POST /destination
  - GET /destination/{destinationId}
  - PUT /destination/{destinationId}
  - DELETE /destination/{destinationId}
  - PUT /destination/{destinationId}/auth
- name: EventSubscription
  api: Webhooks API
  schemas: [Event, stats]
  key: (destinationId, eventType)
  description: >-
    A per-destination subscription to one event type, with an enabled flag, optional headers, and
    delivery statistics (successful, failed, lastError, lastErrorAction, lastErrorTimestamp).
  operations:
  - GET /destination/{destinationId}/events
  - GET /destination/{destinationId}/event/{eventType}
  - PUT /destination/{destinationId}/event/{eventType}
  - DELETE /destination/{destinationId}/event/{eventType}
- name: ReferenceAttribute
  api: Reference API
  schemas: []
  inferred: true
  description: >-
    The canonical vocabularies every other API filters on. Fourteen list endpoints across five
    domains — Intent (topics, b2c-interest, b2b-interest-groups, b2b-personas), Install Data
    (products), Firmographic (company-size, industry, revenue), Demographic (functional-area,
    seniority, professional-group), Geographic (country, state, metro-area).
  operations:
  - GET /topics
  - GET /b2c-interest
  - GET /b2b-interest-groups
  - GET /install-data/products
  - GET /firmographic/company-size
  - GET /firmographic/industry
  - GET /firmographic/revenue
  - GET /demographic/functional-area
  - GET /demographic/seniority
  - GET /demographic/professional-group
  - GET /demographic/b2b-personas
  - GET /geographic/country
  - GET /geographic/state
  - GET /geographic/metro-area
- name: Predicate
  api: Intent API + Account List API
  schemas: [Eq, Neq, In, Nin, Gt, Gte, Lt, Lte, And, Or]
  description: >-
    A shared, recursive filter grammar duplicated verbatim in both the Intent API and the Account
    List API. And/Or compose the eight comparison operators; every leaf names an attribute `a`
    drawn from the Reference API vocabularies.

