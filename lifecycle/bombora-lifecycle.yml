deprecation:
  policy_url: https://developer.bombora.com/api-change-policy
  published: true
  sunset_header: false
  deprecation_header: false
  advance_notice: true
  quote: >-
    "Major Changes ... introduce incompatibilities with earlier major versions, and are indicated
    through a change in the major version number in the API path (e.g. /v1/). Customers utilizing a
    version scheduled for removal will receive advance notice."
  notice_period: unspecified
  non_breaking_changes_declared:
  - Addition of new endpoints, or new methods to existing endpoints.
  - Addition of new optional request attributes or parameters, or new required request attributes that have default values.
  - Addition of new text values (including enum values) accepted in request attributes.
  - Addition of request headers or the removal of undocumented or redundant request headers.
  - Addition of new or undocumented attributes in response models, or the removal of undocumented attributes.
  - Addition of new text values, including enum values, in attributes returned in response models.
  - Changes to the order of attributes returned in response models, the response size, or the length of data within any attribute.
  - Changes to incorrect HTTP response codes, or changes to error messages (consumers should rely on HTTP response codes, not error text).
  - Changes to any tokens, including authentication tokens and page tokens (tokens are opaque and variable in length).
  note: >-
    Minor (non-breaking) changes "may be introduced at any time and without prior notice". The
    policy is a genuine, dated, published contract, but it names no notice window and no
    machine-readable signal (no Sunset / Deprecation response header).
