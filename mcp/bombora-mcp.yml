note: >-
  Bombora serves a real, reachable remote MCP endpoint from its WordPress marketing site
  (bombora.com), advertised by its own RFC 9728 protected-resource document. It is the WordPress
  MCP Adapter surface, NOT an intent-data server: none of Bombora's six product APIs
  (Intent, Reference, Account List, Digital Audience, Webhooks, Authentication) are exposed
  through it, and nothing in Bombora's developer portal references it. Both endpoints answer
  401 to anonymous initialize/tools/list, so the live tool list and input schemas could not be
  read and are NOT guessed here. Recorded as a verified endpoint with an unknown tool surface.

