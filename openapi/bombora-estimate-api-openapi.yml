openapi: 3.2.0
info:
  title: Digital Audience Builder (DAB) Estimate API
  description: 'The Digital Audience Builder (DAB) API provides customers

    the ability to programmatically create and edit custom audiences.


    ### **Security**

    All API endpoints are secured with OAuth 2.0 bearer token authentication. Developers must include a valid Bearer token in the Authorization request header to access endpoints.

    Go to the [Get Started](/get-started) page for additional details.


    ### **Error Handling**

    The API returns appropriate HTTP status codes and error messages in case of unauthorized access (401 Unauthorized) or forbidden actions (403 Forbidden), ensuring secure and reliable interaction.


    ### **Reference Data**

    The API may utilize reference attribute data within a request or response body. See [Reference API](/docs/reference-api/1/overview) for a complete list of supported reference attributes.

    '
  version: v1
servers:
- url: https://api.bombora.com/digital-audiences/v1
security:
- bearerAuth: []
tags:
- name: Estimate
paths:
  /{dataexchange}/estimate:
    post:
      summary: Estimate the size of a digital audience.
      description: The Estimate endpoint allows customers to estimate the size of an audience.
      parameters:
      - $ref: '#/components/parameters/dataexchange'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'The request body includes the following data in a form-data structure:

                *  Requires either domains, topics or filters

                '
              properties:
                topics:
                  $ref: '#/components/schemas/topics'
                domains:
                  $ref: '#/components/schemas/domains'
                filters:
                  $ref: '#/components/schemas/filters'
                surgeId:
                  $ref: '#/components/schemas/surgeId'
                granularInstallData:
                  $ref: '#/components/schemas/granularInstallData'
                filterOr:
                  $ref: '#/components/schemas/filterOr'
                entityParty:
                  $ref: '#/components/schemas/entityParty'
            example:
              topics:
              - '1503561'
              - '1503565'
              filterOr: false
              domains:
              - www.bombora.com
              - www.spotify.com
              entityParty: '3'
              filters:
              - id: ccm_industry
                values:
                - Agriculture
              - id: functional_area
                values:
                - Building & Grounds Maintenance
      responses:
        '200':
          description: OK - Request was successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Estimated size of the audience
              example:
                count: 3904
        '401':
          description: Unauthorized
        '422':
          description: Unprocessable Entity - Request was invalid
          content:
            application/json:
              example:
                errors:
                  granularInstallData:
                  - 'Invalid ids: 23'
                message: One or more validation errors occurred.
        '502':
          description: Bad Gateway
      tags:
      - Estimate
