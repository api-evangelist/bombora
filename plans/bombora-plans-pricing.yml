note: >-
  Bombora publishes no plans, tiers, or prices. https://bombora.com/pricing does not exist —
  it resolves to the "Our Data" marketing page — and no /plans, /pricing or cost page appears in
  bombora.com's Yoast sitemap index. The developer portal at developer.bombora.com has no pricing
  page either: its entire navigation is Home / APIs / My Apps / Support / Sign In, and sign-in is
  SAML SSO restricted to existing Bombora customers ("You must be an existing Bombora User to
  login"). Access is sold as an annual data contract through sales, and API products are approved
  per application by Bombora Support — Intent and Digital Audience are marked approvalType:
  manual in the portal, Reference, Authentication, Account List and Webhooks approvalType: auto,
  but all still require an existing customer relationship.
