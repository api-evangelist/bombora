note: >-
  The only published rate limit Bombora states anywhere is 60 calls per minute per endpoint on the
  legacy partner Company Surge API hosted at sentry.bombora.com. The six current APIs on
  api.bombora.com publish no limits at all. Underlying quota is also commercial — access to the
  Intent and Digital Audience products is manually approved per app in the Apigee portal.
